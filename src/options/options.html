<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reader Mode AI — Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1 data-i18n="optionsTitle">Reader Mode AI</h1>
    <section>
      <h2 data-i18n="optionsReading">Reading</h2>
      <label for="target-lang" data-i18n="optionsDefaultLang">Default translation language</label>
      <select id="target-lang" data-role="target-lang"></select>
    </section>
    <section data-section="provider">
      <h2 data-i18n="optionsProvider">Translation provider</h2>
      <label for="api-key" data-i18n="optionsApiKey">DeepL API key</label>
      <input type="password" id="api-key" data-role="api-key" autocomplete="off" spellcheck="false">
      <label for="endpoint-url" data-i18n="optionsEndpoint">API endpoint override (optional, for tests or proxies)</label>
      <input type="text" id="endpoint-url" data-role="endpoint-url" placeholder="https://api-free.deepl.com/v2/translate" spellcheck="false">
    </section>
    <p data-role="status" role="status"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
